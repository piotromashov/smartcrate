<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>smartcrate</title>
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0;
        background: #0b0b0d;
        color: #ececee;
        font-family: system-ui, "Inter", -apple-system, sans-serif;
      }
      * { box-sizing: border-box; }
      button { font-family: inherit; }
      @keyframes sc-pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }
      .sc-live { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
                 background: #9fef00; margin-right: 8px; vertical-align: middle;
                 animation: sc-pulse 1.4s ease-in-out infinite; }
      /* Crop-to-fill: square window; the 16:9 iframe is oversized + centered so
         the centered square cover art fills the width and the black pillar bars
         are clipped off-screen. */
      .sc-player { position: relative; width: 100%; aspect-ratio: 1 / 1;
                   overflow: hidden; border-radius: 10px; background: #000; }
      .sc-player iframe { position: absolute; top: 0; left: -39%;
                          width: 178%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
